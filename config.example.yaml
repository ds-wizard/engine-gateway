gateway:
  title: Engine Gateway
  version: X.Y.Z
  root_path: /gateway
  info:
    enabled: true
    token: secretToken

mounts:
  /example1:
    module: example_app
    app: app
  /example2:
    module: another_app.app
    factory: create_app
    kwargs:
      debug: true
      database_url: sqlite:///example.db

# Optional Sentry configuration
sentry:
  dsn: https://sentry.io/your-dsn
  traces_sample_rate: 0.2
  profiles_sample_rate: 0.1
  max_breadcrumbs: 50
  # default: development
  environment: production
  # default: version of engine-gateway, e.g. set vX.Y.Z~<sha> of the deployment
  release: v1.2.3~abc1234
  # `component` tag, default: gateway
  component: gateway
  # additional tags for all events
  tags:
    foo: bar
  aws_lambda: true
